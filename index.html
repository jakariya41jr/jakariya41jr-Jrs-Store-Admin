<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRS Store - Advanced Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0b14;
            --header-bg: #131322;
            --card-bg: #18182b;
            --border-color: #2a2a46;
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00f2fe, #4facfe);
            --danger-color: #ff4d4d;
            --text-main: #ffffff;
            --text-muted: #8d8dae;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Login Screen */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .login-box { background: var(--header-bg); padding: 40px; border-radius: 16px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .login-box h2 { color: var(--accent-color); margin-bottom: 25px; font-size: 24px; }
        
        /* Form Elements */
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 13px; margin-bottom: 8px; color: var(--text-muted); font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px 15px; background: #0b0b14; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; font-size: 14px; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-color); outline: none; box-shadow: 0 0 8px rgba(0,242,254,0.2); }
        button[type="submit"] { width: 100%; padding: 14px; background: var(--accent-gradient); border: none; color: #0b0b14; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 15px; transition: 0.3s; margin-top: 10px; }
        button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,242,254,0.3); }

        /* Dashboard Layout */
        #admin-wrapper { display: none; width: 100%; height: 100%; position: relative; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--header-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; }
        .logo-area { padding: 25px 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); }
        .logo-area img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent-color); }
        .logo-area span { font-size: 20px; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-menu { padding: 20px 10px; flex: 1; overflow-y: auto; }
        .nav-item { padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 15px; font-weight: 500; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: var(--card-bg); color: var(--accent-color); }
        .nav-item i { width: 20px; text-align: center; }
        
        .logout-btn { margin: 20px; padding: 12px; background: rgba(255, 77, 77, 0.1); color: var(--danger-color); border: 1px solid var(--danger-color); border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.3s; }
        .logout-btn:hover { background: var(--danger-color); color: #fff; }

        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; background: var(--bg-color); padding: 30px; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .top-header h1 { font-size: 24px; color: #fff; }
        
        .section-box { display: none; background: var(--header-bg); padding: 25px; border-radius: 16px; border: 1px solid var(--border-color); }
        .active-section { display: block; animation: fadeIn 0.4s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #fff; }
        .stat-info span { color: var(--text-muted); font-size: 13px; font-weight: 600; text-transform: uppercase; }
        .stat-info h3 { color: #fff; font-size: 24px; margin-top: 5px; }
        
        .bg-blue { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .bg-green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .bg-yellow { background: linear-gradient(135deg, #f7971e, #ffd200); }
        .bg-red { background: linear-gradient(135deg, #eb3349, #f45c43); }

        /* Layout for Forms & Lists */
        .split-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media (max-width: 900px) { .split-layout { grid-template-columns: 1fr; } }
        
        .list-container { background: #0b0b14; padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); height: 450px; overflow-y: auto; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 10px; }
        .list-item:last-child { border-bottom: none; }
        .item-info { display: flex; align-items: center; gap: 12px; flex: 1; overflow: hidden; }
        .item-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--card-bg); flex-shrink: 0; }
        .item-text { overflow: hidden; }
        .item-text h4 { font-size: 14px; color: #fff; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .item-text p { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
        
        /* Action Buttons */
        .action-btns { display: flex; align-items: center; gap: 6px; }
        .edit-btn { background: rgba(0, 242, 254, 0.1); color: var(--accent-color); border: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; transition: 0.3s; display: inline-flex; justify-content: center; align-items: center; }
        .edit-btn:hover { background: var(--accent-color); color: #0b0b14; }
        .del-btn { background: rgba(255, 77, 77, 0.1); color: var(--danger-color); border: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; transition: 0.3s; display: inline-flex; justify-content: center; align-items: center; }
        .del-btn:hover { background: var(--danger-color); color: #fff; }

        /* Checkbox & Bulk Actions */
        .item-checkbox { width: 18px !important; height: 18px !important; cursor: pointer; accent-color: var(--accent-color); flex-shrink: 0; }
        .list-toolbar { display: flex; justify-content: space-between; align-items: center; background: #0b0b14; padding: 10px 15px; border-radius: 12px 12px 0 0; border: 1px solid var(--border-color); border-bottom: none; }
        .bulk-del-btn { background: var(--danger-color); color: #fff; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.3s; display: none; align-items: center; gap: 6px; }
        .bulk-del-btn:hover { background: #e03e3e; box-shadow: 0 4px 12px rgba(255, 77, 77, 0.3); }

        /* Toast Notification */
        #toast { position: fixed; bottom: 30px; right: 30px; background: var(--accent-gradient); color: #0b0b14; padding: 15px 25px; border-radius: 8px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transform: translateY(100px); opacity: 0; transition: 0.4s; z-index: 9999; display: flex; align-items: center; gap: 10px; }
        #toast.show { transform: translateY(0); opacity: 1; }
        .error-msg { color: var(--danger-color); font-size: 13px; margin-top: 10px; display: none; }

        /* Mobile Responsive Layout */
        .mobile-header {
            display: none;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--header-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .mobile-header button {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 22px;
            cursor: pointer;
        }
        .mobile-header h2 { font-size: 18px; color: #fff; margin: 0; }

        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 998; display: none;
        }
        .sidebar-overlay.active { display: block; }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                z-index: 999;
                transition: left 0.3s ease;
                box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            }
            .sidebar.open { left: 0; }
            .mobile-header { display: flex; }
            .main-content { padding: 15px; width: 100%; }
            .top-header { margin-bottom: 20px; }
            .top-header h1 { font-size: 20px; }
            .stats-grid { grid-template-columns: 1fr; }
            .section-box { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div id="toast"><i class="fas fa-check-circle"></i> <span id="toast-msg">Success!</span></div>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-box">
            <h2><i class="fas fa-user-shield"></i> Admin Panel</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>ইমেইল এড্রেস</label>
                    <input type="email" id="admin-email" required placeholder="admin@jrs.com">
                </div>
                <div class="form-group">
                    <label>পাসওয়ার্ড</label>
                    <input type="password" id="admin-pass" required placeholder="••••••••">
                </div>
                <div id="error-box" class="error-msg"></div>
                <button type="submit">লগইন করুন</button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-wrapper">
        
        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <img src="https://github.com/jakariya41jr/Photos-Row-Link/raw/refs/heads/main/file_00000000798482079f843eb6f797f91d.png" alt="Logo">
                <span>JRS Admin</span>
            </div>
            <div class="nav-menu">
                <div class="nav-item active" onclick="switchSection('dashboard', this)"><i class="fas fa-home"></i> Dashboard</div>
                <div class="nav-item" onclick="switchSection('apps', this)"><i class="fas fa-cloud-arrow-up"></i> Manage Apps</div>
                <div class="nav-item" onclick="switchSection('categories', this)"><i class="fas fa-folder"></i> Categories</div>
                <div class="nav-item" onclick="switchSection('tools', this)"><i class="fas fa-tools"></i> Tools & Modules</div>
                <div class="nav-item" onclick="switchSection('articles', this)"><i class="fas fa-newspaper"></i> Blog Articles</div>
                <div class="nav-item" onclick="switchSection('notices', this)"><i class="fas fa-bullhorn"></i> Notifications</div>
            </div>
            <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> লগআউট</button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Mobile Menu Toggle -->
            <div class="mobile-header">
                <button onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h2>JRS Admin Menu</h2>
            </div>
            
            <!-- Dashboard Overview -->
            <div id="dashboard" class="section-box active-section">
                <div class="top-header">
                    <h1><i class="fas fa-chart-line"></i> Overview</h1>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon bg-blue"><i class="fas fa-mobile-alt"></i></div>
                        <div class="stat-info"><span>Total Apps</span><h3 id="stat-apps">0</h3></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-green"><i class="fas fa-tools"></i></div>
                        <div class="stat-info"><span>Tools & Modules</span><h3 id="stat-tools">0</h3></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-yellow"><i class="fas fa-list"></i></div>
                        <div class="stat-info"><span>Categories</span><h3 id="stat-cats">0</h3></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-red"><i class="fas fa-bell"></i></div>
                        <div class="stat-info"><span>Active Notices</span><h3 id="stat-notices">0</h3></div>
                    </div>
                </div>
            </div>

            <!-- Manage Apps -->
            <div id="apps" class="section-box">
                <div class="top-header"><h1 id="app-form-title"><i class="fas fa-cloud-arrow-up"></i> Upload / Edit App</h1></div>
                <div class="split-layout">
                    <form id="app-form">
                        <input type="hidden" id="editing-app-key" value="">
                        <div class="form-group">
                            <label>Title (অ্যাপের নাম)</label>
                            <input type="text" id="app-title" required>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="app-category"><option value="General">General</option></select>
                        </div>
                        <div class="form-group">
                            <label>Image URL</label>
                            <input type="url" id="app-image" required>
                        </div>
                        <div class="form-group">
                            <label>Download URL</label>
                            <input type="url" id="app-download" required>
                        </div>
                        <div class="form-group">
                            <label>Version</label>
                            <input type="text" id="app-version" placeholder="v1.0" required>
                        </div>
                        <!-- Manual Download Count Adjuster -->
                        <div class="form-group">
                            <label>Manual Downloads Count (ডাউনলোড সংখ্যা)</label>
                            <input type="number" id="app-downloads-count" placeholder="e.g. 1500" value="0" min="0" required>
                        </div>
                        <button type="submit" id="app-submit-btn"><i class="fas fa-plus"></i> Upload App</button>
                        <button type="button" id="cancel-edit-btn" style="display:none; background: var(--border-color); color: #fff; margin-top: 8px; width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;" onclick="resetAppForm()">Cancel Edit</button>
                    </form>

                    <!-- Apps List View with Bulk Action Bar -->
                    <div>
                        <div class="list-toolbar">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-main);">
                                <input type="checkbox" id="select-all-apps" class="item-checkbox" onclick="toggleSelectAllApps(this)">
                                Select All
                            </label>
                            <button id="bulk-delete-btn" class="bulk-del-btn" onclick="deleteSelectedApps()">
                                <i class="fas fa-trash"></i> Delete Selected (<span id="selected-count">0</span>)
                            </button>
                        </div>
                        <div class="list-container" id="app-list" style="border-top-left-radius: 0; border-top-right-radius: 0;"></div>
                    </div>
                </div>
            </div>

            <!-- Manage Categories -->
            <div id="categories" class="section-box">
                <div class="top-header"><h1><i class="fas fa-folder"></i> Categories</h1></div>
                <div class="split-layout">
                    <form id="cat-form">
                        <div class="form-group">
                            <label>Category Name</label>
                            <input type="text" id="cat-name" required>
                        </div>
                        <button type="submit">Add Category</button>
                    </form>
                    <div class="list-container" id="cat-list"></div>
                </div>
            </div>

            <!-- Manage Tools -->
            <div id="tools" class="section-box">
                <div class="top-header"><h1><i class="fas fa-tools"></i> Tools & Modules</h1></div>
                <div class="split-layout">
                    <form id="tool-form">
                        <div class="form-group"><label>Title</label><input type="text" id="tool-title" required></div>
                        <div class="form-group"><label>Description</label><textarea id="tool-desc" rows="2" required></textarea></div>
                        <div class="form-group"><label>Image URL</label><input type="url" id="tool-image" required></div>
                        <div class="form-group"><label>Download URL</label><input type="url" id="tool-download" required></div>
                        <button type="submit">Add Tool</button>
                    </form>
                    <div class="list-container" id="tool-list"></div>
                </div>
            </div>

            <!-- Manage Articles -->
            <div id="articles" class="section-box">
                <div class="top-header"><h1><i class="fas fa-newspaper"></i> Blog Articles</h1></div>
                <div class="split-layout">
                    <form id="article-form">
                        <div class="form-group"><label>Article Title</label><input type="text" id="art-title" required></div>
                        <div class="form-group"><label>Content / Description</label><textarea id="art-desc" rows="4" required></textarea></div>
                        <div class="form-group"><label>Reference Link (Optional)</label><input type="url" id="art-link"></div>
                        <button type="submit">Publish Article</button>
                    </form>
                    <div class="list-container" id="article-list"></div>
                </div>
            </div>

            <!-- Manage Notices -->
            <div id="notices" class="section-box">
                <div class="top-header"><h1><i class="fas fa-bullhorn"></i> Notice Ticker</h1></div>
                <div class="split-layout">
                    <form id="notice-form">
                        <div class="form-group"><label>Notice Title</label><input type="text" id="notice-title" required></div>
                        <div class="form-group"><label>Notice Message (Body)</label><textarea id="notice-body" rows="3" required></textarea></div>
                        <button type="submit">Publish Notice</button>
                    </form>
                    <div class="list-container" id="notice-list"></div>
                </div>
            </div>

        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCTV_PGdsnI2Tcbou3IJUU_r8ylwev9fU0",
            authDomain: "jrs-store.firebaseapp.com",
            databaseURL: "https://jrs-store-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "jrs-store",
            storageBucket: "jrs-store.firebasestorage.app",
            messagingSenderId: "253830850008",
            appId: "1:253830850008:web:65cf02177ba051ef22fead"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Cache for apps data
        let loadedAppsData = {};

        // Toast Notification Function
        window.showToast = function(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Toggle Mobile Sidebar
        window.toggleSidebar = function() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        // Section Switcher
        window.switchSection = function(id, el) {
            document.querySelectorAll('.section-box').forEach(s => s.classList.remove('active-section'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-section');
            if(el) el.classList.add('active');

            if(window.innerWidth <= 768) {
                document.querySelector('.sidebar').classList.remove('open');
                document.getElementById('overlay').classList.remove('active');
            }
        }

        // Global Delete Single Data
        window.deleteData = function(path, key) {
            if(confirm('Are you sure you want to delete this?')) {
                remove(ref(db, `${path}/${key}`)).then(() => showToast('Deleted successfully!'));
            }
        }

        // --- Multi-Select & Bulk Delete Logic ---
        window.updateBulkDeleteUI = function() {
            const checkedBoxes = document.querySelectorAll('.item-checkbox[data-key]:checked');
            const bulkBtn = document.getElementById('bulk-delete-btn');
            const countSpan = document.getElementById('selected-count');
            const selectAllCb = document.getElementById('select-all-apps');
            const totalBoxes = document.querySelectorAll('.item-checkbox[data-key]');

            if (countSpan) countSpan.innerText = checkedBoxes.length;
            
            if (checkedBoxes.length > 0) {
                if (bulkBtn) bulkBtn.style.display = 'inline-flex';
            } else {
                if (bulkBtn) bulkBtn.style.display = 'none';
            }

            if (selectAllCb && totalBoxes.length > 0) {
                selectAllCb.checked = (checkedBoxes.length === totalBoxes.length);
            }
        }

        window.toggleSelectAllApps = function(masterCb) {
            const checkboxes = document.querySelectorAll('.item-checkbox[data-key]');
            checkboxes.forEach(cb => cb.checked = masterCb.checked);
            updateBulkDeleteUI();
        }

        window.deleteSelectedApps = function() {
            const checkedBoxes = document.querySelectorAll('.item-checkbox[data-key]:checked');
            if (checkedBoxes.length === 0) return;

            if (confirm(`Are you sure you want to delete ${checkedBoxes.length} selected app(s)?`)) {
                const deletePromises = [];
                checkedBoxes.forEach(cb => {
                    const key = cb.getAttribute('data-key');
                    if (key) {
                        deletePromises.push(remove(ref(db, `latest_updates/${key}`)));
                    }
                });

                Promise.all(deletePromises)
                    .then(() => {
                        showToast(`${checkedBoxes.length} App(s) deleted successfully!`);
                        const selectAllCb = document.getElementById('select-all-apps');
                        if (selectAllCb) selectAllCb.checked = false;
                        updateBulkDeleteUI();
                    })
                    .catch(err => {
                        showToast('Error deleting apps!');
                        console.error(err);
                    });
            }
        }

        // --- Edit App Logic ---
        window.editApp = function(key) {
            const item = loadedAppsData[key];
            if (!item) return;

            document.getElementById('editing-app-key').value = key;
            document.getElementById('app-title').value = item.title || '';
            document.getElementById('app-category').value = item.category || 'General';
            document.getElementById('app-image').value = item.image_url || '';
            document.getElementById('app-download').value = item.download_url || '';
            document.getElementById('app-version').value = item.version || 'v1.0';
            document.getElementById('app-downloads-count').value = item.downloads !== undefined ? item.downloads : 0;

            document.getElementById('app-submit-btn').innerHTML = '<i class="fas fa-save"></i> Save Changes';
            document.getElementById('cancel-edit-btn').style.display = 'block';

            document.getElementById('apps').scrollIntoView({ behavior: 'smooth' });
        }

        window.resetAppForm = function() {
            document.getElementById('editing-app-key').value = '';
            document.getElementById('app-form').reset();
            document.getElementById('app-downloads-count').value = 0;
            document.getElementById('app-submit-btn').innerHTML = '<i class="fas fa-plus"></i> Upload App';
            document.getElementById('cancel-edit-btn').style.display = 'none';
        }

        // Auth Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-wrapper').style.display = 'flex';
                loadAllData();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('admin-wrapper').style.display = 'none';
            }
        });

        // Login
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(() => {
                const err = document.getElementById('error-box');
                err.innerText = "ভুল ইমেইল বা পাসওয়ার্ড!";
                err.style.display = 'block';
            });
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Load Database Data
        function loadAllData() {
            // 1. Categories
            onValue(ref(db, 'categories'), snap => {
                const data = snap.val();
                let count = 0;
                document.getElementById('cat-list').innerHTML = '';
                document.getElementById('app-category').innerHTML = '<option value="General">General</option>';
                if(data) {
                    Object.keys(data).forEach(key => {
                        count++;
                        let name = data[key].name;
                        document.getElementById('app-category').innerHTML += `<option value="${name}">${name}</option>`;
                        document.getElementById('cat-list').innerHTML += `
                            <div class="list-item">
                                <div class="item-text"><h4>${name}</h4></div>
                                <button class="del-btn" onclick="deleteData('categories', '${key}')"><i class="fas fa-trash"></i></button>
                            </div>`;
                    });
                }
                document.getElementById('stat-cats').innerText = count;
            });

            // 2. Apps (with Checkbox & Edit capability)
            onValue(ref(db, 'latest_updates'), snap => {
                const data = snap.val();
                loadedAppsData = data || {};
                let count = 0;
                document.getElementById('app-list').innerHTML = '';
                if(data) {
                    Object.keys(data).forEach(key => {
                        count++;
                        let item = data[key];
                        document.getElementById('app-list').innerHTML += `
                            <div class="list-item">
                                <div class="item-info">
                                    <input type="checkbox" class="item-checkbox" data-key="${key}" onchange="updateBulkDeleteUI()">
                                    <img src="${item.image_url}" class="item-img" onerror="this.src='https://via.placeholder.com/40'">
                                    <div class="item-text">
                                        <h4>${item.title}</h4>
                                        <p>${item.category} • ${item.version} • <i class="fas fa-download"></i> ${item.downloads || 0}</p>
                                    </div>
                                </div>
                                <div class="action-btns">
                                    <button class="edit-btn" title="Edit App" onclick="editApp('${key}')"><i class="fas fa-pen"></i></button>
                                    <button class="del-btn" title="Delete App" onclick="deleteData('latest_updates', '${key}')"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>`;
                    });
                }
                document.getElementById('stat-apps').innerText = count;
                updateBulkDeleteUI();
            });

            // 3. Tools
            onValue(ref(db, 'tools_modules'), snap => {
                const data = snap.val();
                let count = 0;
                document.getElementById('tool-list').innerHTML = '';
                if(data) {
                    Object.keys(data).forEach(key => {
                        count++;
                        let item = data[key];
                        document.getElementById('tool-list').innerHTML += `
                            <div class="list-item">
                                <div class="item-info">
                                    <img src="${item.image_url}" class="item-img">
                                    <div class="item-text"><h4>${item.title}</h4></div>
                                </div>
                                <button class="del-btn" onclick="deleteData('tools_modules', '${key}')"><i class="fas fa-trash"></i></button>
                            </div>`;
                    });
                }
                document.getElementById('stat-tools').innerText = count;
            });

            // 4. Articles
            onValue(ref(db, 'site_updates'), snap => {
                const data = snap.val();
                document.getElementById('article-list').innerHTML = '';
                if(data) {
                    Object.keys(data).forEach(key => {
                        document.getElementById('article-list').innerHTML += `
                            <div class="list-item">
                                <div class="item-text"><h4>${data[key].title}</h4></div>
                                <button class="del-btn" onclick="deleteData('site_updates', '${key}')"><i class="fas fa-trash"></i></button>
                            </div>`;
                    });
                }
            });

            // 5. Notices
            onValue(ref(db, 'notices'), snap => {
                const data = snap.val();
                let count = 0;
                document.getElementById('notice-list').innerHTML = '';
                if(data) {
                    Object.keys(data).forEach(key => {
                        count++;
                        document.getElementById('notice-list').innerHTML += `
                            <div class="list-item">
                                <div class="item-text"><h4>${data[key].title}</h4><p>${data[key].body}</p></div>
                                <button class="del-btn" onclick="deleteData('notices', '${key}')"><i class="fas fa-trash"></i></button>
                            </div>`;
                    });
                }
                document.getElementById('stat-notices').innerText = count;
            });
        }

        // --- Form Submissions ---

        // Category Form
        document.getElementById('cat-form').addEventListener('submit', e => {
            e.preventDefault();
            push(ref(db, 'categories'), { name: document.getElementById('cat-name').value })
            .then(() => { showToast('Category Added!'); e.target.reset(); });
        });

        // App Form (Handles both Create & Update with Manual Downloads Count)
        document.getElementById('app-form').addEventListener('submit', e => {
            e.preventDefault();
            const editKey = document.getElementById('editing-app-key').value;
            const appData = {
                title: document.getElementById('app-title').value,
                category: document.getElementById('app-category').value,
                image_url: document.getElementById('app-image').value,
                download_url: document.getElementById('app-download').value,
                version: document.getElementById('app-version').value,
                downloads: parseInt(document.getElementById('app-downloads-count').value) || 0,
                rating: 4.8
            };

            if (editKey) {
                // Update existing app
                update(ref(db, `latest_updates/${editKey}`), appData)
                .then(() => {
                    showToast('App Updated Successfully!');
                    resetAppForm();
                })
                .catch(() => showToast('Failed to update app!'));
            } else {
                // Push new app
                push(ref(db, 'latest_updates'), appData)
                .then(() => {
                    showToast('App Uploaded!');
                    resetAppForm();
                })
                .catch(() => showToast('Failed to upload app!'));
            }
        });

        // Tool Form
        document.getElementById('tool-form').addEventListener('submit', e => {
            e.preventDefault();
            push(ref(db, 'tools_modules'), {
                title: document.getElementById('tool-title').value,
                description: document.getElementById('tool-desc').value,
                image_url: document.getElementById('tool-image').value,
                download_url: document.getElementById('tool-download').value
            }).then(() => { showToast('Tool Added!'); e.target.reset(); });
        });

        // Article Form
        document.getElementById('article-form').addEventListener('submit', e => {
            e.preventDefault();
            push(ref(db, 'site_updates'), {
                title: document.getElementById('art-title').value,
                description: document.getElementById('art-desc').value,
                link: document.getElementById('art-link').value
            }).then(() => { showToast('Article Published!'); e.target.reset(); });
        });

        // Notice Form
        document.getElementById('notice-form').addEventListener('submit', e => {
            e.preventDefault();
            push(ref(db, 'notices'), {
                title: document.getElementById('notice-title').value,
                body: document.getElementById('notice-body').value
            }).then(() => { showToast('Notice Published!'); e.target.reset(); });
        });

    </script>
</body>
</html>
